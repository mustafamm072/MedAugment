name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check medaugmentx tests examples notebooks

      - name: Type check (mypy)
        run: |
          pip install mypy types-PyYAML
          mypy medaugmentx --ignore-missing-imports

      - name: Run tests
        run: pytest --cov=medaugmentx --cov-report=xml -q

      - name: Run adoption examples
        if: matrix.python-version == '3.12'
        run: |
          python examples/quickstart.py
          python examples/reproducible_experiment.py
          python benchmarks/benchmark.py --shape 8 16 16 --repeats 1
          python benchmarks/benchmark.py --shape 16 16 --repeats 1

      - name: Run tutorial notebooks
        if: matrix.python-version == '3.12'
        run: |
          pip install -e ".[notebooks]"
          python notebooks/run_notebooks.py

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  package:
    name: Built distribution and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Test installed wheel outside the source tree
        run: |
          python -m venv /tmp/medaugmentx-wheel
          wheel=$(ls dist/*.whl)
          /tmp/medaugmentx-wheel/bin/python -m pip install "${wheel}[test]"
          # Keep the copied tree named "tests": pytest derives module names from
          # the rootdir-relative path, and "medaugmentx-tests" is not importable.
          mkdir -p /tmp/medaugmentx-wheel-check
          cp -R tests /tmp/medaugmentx-wheel-check/tests
          cp pyproject.toml /tmp/medaugmentx-wheel-check/pyproject.toml
          cd /tmp/medaugmentx-wheel-check
          /tmp/medaugmentx-wheel/bin/python -m pytest tests -q
      - name: Build searchable documentation
        run: |
          python -m pip install ".[docs]"
          python -m sphinx -W --keep-going -b html -c docs/sphinx . /tmp/medaugmentx-docs
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-and-docs
          path: |
            dist/
            /tmp/medaugmentx-docs/
